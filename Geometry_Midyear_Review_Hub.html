<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geometry Midyear Review Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F2; --grid:#DCE4E1; --ink:#1B2530; --muted:#4F5B68; --line:#AEBBB8; --white:#fff;
  --c1:#0E7C86; --c2:#8A3FA0; --c3:#A85F00; --c4:#2B5BD7;
  --ok:#17693A; --okbg:#E6F4EA; --bad:#A8231B; --badbg:#FBE9E7; --hl:#FFE9A8;
  --head:"Bricolage Grotesque","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI","Cambria Math",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--body);font-size:18px;line-height:1.5;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0}
h1{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.2rem;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
.sheet{background:var(--white);border:2px solid var(--ink);border-radius:4px;padding:18px;margin-top:18px}
.muted{color:var(--muted)}
.small{font-size:.9rem}

/* Title block (drafting-sheet style) */
.titleblock{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;border:2px solid var(--ink);background:var(--white);margin-top:16px}
.titleblock>div{padding:8px 12px;border-right:2px solid var(--ink);min-width:0}
.titleblock>div:last-child{border-right:0}
.titleblock .k{font-size:.78rem;color:var(--muted)}
.titleblock .v{font-family:var(--head);font-weight:800;font-size:1.35rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:620px){.titleblock{grid-template-columns:1fr 1fr}.titleblock>div:nth-child(2){border-right:0}.titleblock>div:nth-child(-n+2){border-bottom:2px solid var(--ink)}}

/* Buttons */
.primary{background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:4px;padding:10px 18px;font-weight:700}
.primary:hover{background:#2c3a49}
.primary[disabled]{background:#9aa5a2;border-color:#9aa5a2;cursor:not-allowed}
.ghost{background:var(--white);border:2px solid var(--ink);border-radius:4px;padding:8px 14px;font-weight:700}
.ghost:hover{background:var(--hl)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Level picker */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.lv{background:var(--white);border:2px solid var(--line);border-radius:4px;padding:10px;text-align:left}
.lv b{display:block;font-family:var(--head)}
.lv[aria-pressed="true"]{border-color:var(--ink);background:var(--hl);box-shadow:inset 0 0 0 1px var(--ink)}
@media(max-width:620px){.levels{grid-template-columns:1fr}}

/* Zones */
.zone{border:2px solid var(--ink);border-left:12px solid var(--cc);background:var(--white);padding:14px 16px;margin-top:14px;border-radius:4px}
.zone h3{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.zone .state{font-size:.9rem;font-weight:700}
.ruler{height:26px;border:2px solid var(--ink);background:var(--white);position:relative;margin:10px 0;overflow:hidden}
.ruler .fill{position:absolute;inset:0 auto 0 0;background:var(--cc);opacity:.85;width:0}
.ruler .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9.2%,var(--ink) 9.2% 10%);opacity:.55;
  -webkit-mask:linear-gradient(#000 0 0);}
.ruler .ticks::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 4.4%,rgba(27,37,48,.55) 4.4% 5%);-webkit-mask:linear-gradient(transparent 55%,#000 55%);mask:linear-gradient(transparent 55%,#000 55%)}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 0;padding-left:22px}
details li{margin:4px 0}
.boss{border-left-color:var(--ink);background:#EEF1EF}

/* Quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.bar{height:14px;border:2px solid var(--ink);background:#fff;flex:1;min-width:120px}
.bar>i{display:block;height:100%;background:var(--ink)}
.tag{display:inline-block;font-weight:700;border-bottom:4px solid var(--cc);margin:0 0 10px}
.qtext{font-size:1.2rem;margin:0 0 12px}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--white);border:2px solid var(--ink);border-radius:4px;padding:10px 12px;min-height:50px}
.opt:hover:not([disabled]){background:var(--hl)}
.opt .ltr{flex:none;width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt .mark{margin-left:auto;font-weight:700}
.opt[disabled]{cursor:default}
.hintbox p{margin:6px 0;padding:8px 12px;background:var(--hl);border-left:6px solid #C9A100}
.fb{padding:12px 14px;border:2px solid;border-radius:4px;margin:12px 0}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb p{margin:6px 0 0}
svg.fig{max-width:340px;width:100%;height:auto;display:block;margin:6px 0;border:1px dashed var(--line);background:#fff}
svg.fig text{font-family:var(--body);font-size:13px;fill:var(--ink)}
svg.fig .hlc{fill:var(--hl);stroke:var(--ink);stroke-width:1}
svg.fig .hlt{font-weight:700}

/* Results */
.big{font-family:var(--head);font-weight:800;font-size:3.2rem;line-height:1}
.list{padding-left:22px}
.lb table{width:100%;border-collapse:collapse}
.lb td,.lb th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.toast{background:var(--hl);border:2px solid var(--ink);padding:8px 12px;margin:10px 0;border-radius:4px;font-weight:700}
input[type=text],select{font:inherit;padding:10px 12px;border:2px solid var(--ink);border-radius:4px;background:#fff;width:100%}
label.f{display:block;margin-top:12px;font-weight:700}
@media(prefers-reduced-motion:no-preference){.ruler .fill{transition:width .6s ease}}
@media print{body{background:#fff}.ghost,.primary{display:none}}
</style>
</head>
<body>
<main>

<!-- WELCOME -->
<section id="welcome" hidden>
  <h1>Geometry Midyear Review</h1>
  <p class="muted" style="margin:10px 0 0">Chapters 1 to 4, built for studying at home over break. Enter your name to save your progress on this device.</p>
  <div class="sheet">
    <label class="f" for="nm" style="margin-top:0">Your name</label>
    <input type="text" id="nm" autocomplete="off" maxlength="30">
    <label class="f" for="pd">Your class period</label>
    <select id="pd"><option value="">Choose a period</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select>
    <p id="welcomeErr" class="small" style="color:var(--bad);font-weight:700;margin:10px 0 0" role="alert"></p>
    <div class="row" style="margin-top:14px"><button class="primary" data-act="start">Open the hub</button></div>
  </div>
</section>

<!-- HOME -->
<section id="home" hidden></section>

<!-- QUIZ -->
<section id="quiz" hidden>
  <div class="qtop">
    <button class="ghost" data-act="leave">Leave practice</button>
    <div class="bar" aria-hidden="true"><i id="qbar" style="width:0"></i></div>
    <div id="qprog" class="small" style="font-weight:700"></div>
  </div>
  <div id="leaveBox" class="toast" hidden role="alertdialog" aria-label="Leave practice">
    <p style="margin:0 0 8px">Leave this practice round? Your answers so far are saved, but the round will not count toward clearing a zone.</p>
    <div class="row"><button class="primary" data-act="leaveYes">Yes, leave</button><button class="ghost" data-act="leaveNo">Keep going</button></div>
  </div>
  <article class="sheet" id="qcard"></article>
</section>

<!-- RESULT -->
<section id="result" hidden></section>

</main>

<script>
/*GEN-START*/
const CONFIG={SCRIPT_URL:"",TEST_NAME:"Midyear Assessment"};

/* ---------- helpers ---------- */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const nz=(a,b)=>{let v;do{v=R(a,b)}while(v===0);return v};
const sg=n=>n<0?"\u2212"+Math.abs(n):String(n);
const P=(x,y)=>"("+sg(x)+", "+sg(y)+")";
const PA=a=>P(a[0],a[1]);
const V=(a,b)=>"\u27E8"+sg(a)+", "+sg(b)+"\u27E9";
function fr(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;n/=g;d/=g;return d===1?sg(n):sg(n)+"/"+d}
function eq(num,den,b){ // y = (num/den)x + b
  if(den<0){num=-num;den=-den}const g=gcd(num,den)||1;num/=g;den/=g;
  let s;if(den===1){s=num===1?"x":num===-1?"\u2212x":sg(num)+"x"}
  else{s=(num<0?"\u2212":"")+"("+Math.abs(num)+"/"+den+")x"}
  return "y = "+s+(b===0?"":b>0?" + "+b:" \u2212 "+Math.abs(b));
}
const nw=(c,l)=>{const s=[];[...l,c+1,c-1,c+2,c-2,c+3,c+10].forEach(v=>{if(v!==c&&!s.includes(v)&&(v>0||c<=0))s.push(v)});return s.slice(0,3)};
const rp=()=>{let x,y;do{x=nz(-7,7);y=nz(-7,7)}while(Math.abs(x)===Math.abs(y));return [x,y]};

function Q(o){
  const u=o.unit||"",c=String(o.correct)+u;
  const w=[...new Set(o.wrongs.map(v=>String(v)+u))].filter(v=>v!==c).slice(0,3);
  const opts=o.keep?o.opts:shuffle([c,...w]);
  return {skill:o.skill,q:o.q,fig:o.fig||"",opts,ans:opts.indexOf(c),hints:o.hints||[],sol:o.sol||"",ch:0};
}
function stat(skill,d,items){
  return {skill,d,f(){const it=pick(items);const fg=it[5]?(typeof it[5]==="function"?it[5]():it[5]):"";return Q({skill,fig:fg,q:it[0],correct:it[1],wrongs:it[2],hints:[it[3]],sol:it[4]||it[3]})}};
}

/* ---------- figure helpers ---------- */
let _cp=0;
const INK="#1B2530",BLUE="#2B5BD7",ORG="#B8530B",TEAL="#0E7C86",MUTE="#55616E";
const f1=n=>Math.round(n*10)/10;
const svgw=(w,h,body,label)=>'<svg class="fig" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+(label||"Diagram for the question")+'"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="'+INK+'"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="'+BLUE+'"/></marker></defs>'+body+'</svg>';
const tx=(x,y,t,o)=>{o=o||{};return '<text x="'+f1(x)+'" y="'+f1(y)+'" text-anchor="'+(o.a||"middle")+'" style="paint-order:stroke;stroke:#fff;stroke-width:3px;fill:'+(o.c||INK)+(o.s?';font-size:'+o.s+'px':'')+(o.w?';font-weight:'+o.w:'')+'">'+t+'</text>'};
const ln=(x1,y1,x2,y2,o)=>{o=o||{};return '<line x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'" stroke="'+(o.c||INK)+'" stroke-width="'+(o.w||2)+'"'+(o.d?' stroke-dasharray="6 4"':'')+(o.m?' marker-end="url(#'+o.m+')"':'')+'/>'};
const dot=(x,y,c,r)=>'<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+(r||4)+'" fill="'+(c||INK)+'"/>';
const poly=(p,o)=>{o=o||{};return '<polygon points="'+p.map(q=>f1(q[0])+","+f1(q[1])).join(" ")+'" fill="'+(o.f||"none")+'" stroke="'+(o.c||INK)+'" stroke-width="'+(o.w||2)+'"'+(o.d?' stroke-dasharray="5 3"':'')+'/>'};
const box=(x,y,w,h,lines,o)=>{o=o||{};let s='<rect x="'+f1(x)+'" y="'+y+'" width="'+f1(w)+'" height="'+h+'" rx="4" fill="'+(o.f||"#fff")+'" stroke="'+(o.c||INK)+'" stroke-width="2"/>';const L=String(lines).split("\n"),lh=15,y0=y+h/2-(L.length-1)*lh/2+4.5;L.forEach((t,i)=>{s+=tx(x+w/2,y0+i*lh,t,{s:o.s||13,w:o.w})});return s};

/* ---------- coordinate plane ---------- */
function plane(o){
  o=o||{};const pts=o.pts||[],segs=o.segs||[],polys=o.polys||[],lines=o.lines||[],paths=o.paths||[],texts=o.texts||[];
  const all=[[0,0]];
  pts.forEach(p=>all.push(p.p));segs.forEach(s=>all.push(s[0],s[1]));polys.forEach(pl=>pl.pts.forEach(q=>all.push(q)));
  lines.forEach(l=>all.push(l.a,l.b));paths.forEach(p=>p.pts.forEach(q=>all.push(q)));texts.forEach(t=>all.push(t.p));
  const xa=all.map(q=>q[0]),ya=all.map(q=>q[1]);
  let x0=Math.min(...xa)-1,x1=Math.max(...xa)+1,y0=Math.min(...ya)-1,y1=Math.max(...ya)+1;
  let span=Math.max(x1-x0,y1-y0,8);const cx=(x0+x1)/2,cy=(y0+y1)/2;
  x0=Math.floor(cx-span/2);y0=Math.floor(cy-span/2);span+=1;
  if(o.view){x0=o.view[0];y0=o.view[2];span=o.view[1]-o.view[0]}
  x1=x0+span;y1=y0+span;
  const W=300,m=24,sc=(W-2*m)/span,X=x=>m+(x-x0)*sc,Y=y=>W-m-(y-y0)*sc;
  const clip="cp"+(++_cp),step=span>20?2:1,tl=span<=10?1:span<=20?2:5;
  let g="",lab="";
  for(let i=Math.ceil(x0/step)*step;i<=x1;i+=step)g+=ln(X(i),m,X(i),W-m,{c:"#DCE4E1",w:1});
  for(let j=Math.ceil(y0/step)*step;j<=y1;j+=step)g+=ln(m,Y(j),W-m,Y(j),{c:"#DCE4E1",w:1});
  const ax0=x0<=0&&0<=x1,ay0=y0<=0&&0<=y1;
  if(ax0)g+=ln(X(0),m,X(0),W-m,{w:1.8});
  if(ay0)g+=ln(m,Y(0),W-m,Y(0),{w:1.8});
  g+='<rect x="'+m+'" y="'+m+'" width="'+(W-2*m)+'" height="'+(W-2*m)+'" fill="none" stroke="'+INK+'" stroke-width="1.5"/>';
  for(let i=Math.ceil(x0/tl)*tl;i<=x1;i+=tl)lab+=tx(X(i),W-m+14,sg(i),{s:10});
  for(let j=Math.ceil(y0/tl)*tl;j<=y1;j+=tl)lab+=tx(m-5,Y(j)+3.5,sg(j),{a:"end",s:10});
  if(ay0)lab+=tx(W-m-6,Y(0)-6,"x",{a:"end",s:12,w:700});
  if(ax0)lab+=tx(X(0)+8,m+13,"y",{a:"start",s:12,w:700});
  let c="";
  polys.forEach(pl=>{c+=poly(pl.pts.map(q=>[X(q[0]),Y(q[1])]),{f:"rgba(14,124,134,.16)",c:pl.c,d:pl.d})});
  lines.forEach(l=>{const dx=l.b[0]-l.a[0],dy=l.b[1]-l.a[1];c+=ln(X(l.a[0]-60*dx),Y(l.a[1]-60*dy),X(l.a[0]+60*dx),Y(l.a[1]+60*dy),{c:l.c,w:l.w,d:l.d})});
  segs.forEach(s=>{const o2=s[2]||{};c+=ln(X(s[0][0]),Y(s[0][1]),X(s[1][0]),Y(s[1][1]),o2)});
  paths.forEach(p=>{c+='<polyline points="'+p.pts.map(q=>f1(X(q[0]))+","+f1(Y(q[1]))).join(" ")+'" fill="none" stroke="'+(p.c||BLUE)+'" stroke-width="2.5"'+(p.arrow?' marker-end="url(#arrb)"':'')+'/>'});
  const PC={pre:INK,img:BLUE,unk:ORG,mid:TEAL};let pt="";
  pts.forEach(p=>{const col=PC[p.c||"pre"],px=X(p.p[0]),py=Y(p.p[1]);pt+=dot(px,py,col,5);
    if(p.l){const pos=p.pos==="l"?[-8,-8,"end"]:p.pos==="b"?[0,19,"middle"]:[8,-8,"start"];pt+=tx(px+pos[0],py+pos[1],p.l,{a:pos[2],c:col,w:700,s:14})}});
  texts.forEach(t=>{pt+=tx(X(t.p[0]),Y(t.p[1]),t.t,{c:t.c,a:t.a,s:t.s||12,w:700})});
  return svgw(300,300,'<clipPath id="'+clip+'"><rect x="'+m+'" y="'+m+'" width="'+(W-2*m)+'" height="'+(W-2*m)+'"/></clipPath>'+g+lab+'<g clip-path="url(#'+clip+')">'+c+'</g>'+pt,"Coordinate plane for the question");
}

/* ---------- angles ---------- */
function anglefig(o){
  const vx=o.vx||150,vy=o.vy||165,len=o.len||120,rad=Math.PI/180;
  const Pt=(d,r)=>[vx+r*Math.cos(d*rad),vy-r*Math.sin(d*rad)];
  let s="";
  (o.rays||[]).forEach(r=>{const e=Pt(r.d,len);s+=ln(vx,vy,e[0],e[1],{m:"arr"});if(r.l){const l=Pt(r.d,len+14);s+=tx(l[0],l[1]+4,r.l,{w:700})}});
  (o.right||[]).forEach(a=>{const d1=[Math.cos(a[0]*rad),-Math.sin(a[0]*rad)],d2=[Math.cos(a[1]*rad),-Math.sin(a[1]*rad)],k=15;
    s+='<path d="M'+f1(vx+k*d1[0])+' '+f1(vy+k*d1[1])+' L'+f1(vx+k*(d1[0]+d2[0]))+' '+f1(vy+k*(d1[1]+d2[1]))+' L'+f1(vx+k*d2[0])+' '+f1(vy+k*d2[1])+'" fill="none" stroke="'+INK+'" stroke-width="1.6"/>'});
  (o.arcs||[]).forEach(a=>{const p1=Pt(a.a1,a.r),p2=Pt(a.a2,a.r),big=(a.a2-a.a1)>180?1:0,col=a.c||BLUE;
    s+='<path d="M'+f1(p1[0])+' '+f1(p1[1])+' A'+a.r+' '+a.r+' 0 '+big+' 0 '+f1(p2[0])+' '+f1(p2[1])+'" fill="none" stroke="'+col+'" stroke-width="2.5"/>';
    const md=(a.a1+a.a2)/2;
    if(a.tick){const t1=Pt(md,a.r-6),t2=Pt(md,a.r+6);s+=ln(t1[0],t1[1],t2[0],t2[1],{c:col,w:2})}
    if(a.t){if(a.lx!==undefined)s+=tx(a.lx,a.ly,a.t,{c:col,w:700,a:"start"});else{const l=Pt(md,a.lr||a.r+26),cs=Math.cos(md*rad),an=cs<-0.2?"end":cs>0.2?"start":"middle";s+=tx(l[0]+(an==="end"?-3:an==="start"?3:0),l[1]+4,a.t,{c:col,w:700,a:an})}}});
  s+=dot(vx,vy,INK,4);if(o.vl)s+=tx(vx,vy+17,o.vl,{w:700});
  if(o.note)s+=tx(290,14,"not to scale",{a:"end",s:10,c:MUTE});
  return svgw(300,185,s,"Angle diagram for the question");
}
function icon(cx,cy,a1,a2,l,o){o=o||{};const rad=Math.PI/180,E=(a,r)=>[cx+r*Math.cos(a*rad),cy-r*Math.sin(a*rad)];
  let s=ln(cx,cy,E(a1,46)[0],E(a1,46)[1])+ln(cx,cy,E(a2,46)[0],E(a2,46)[1]);
  if(o.right)s+='<path d="M'+(cx+12)+' '+cy+' L'+(cx+12)+' '+(cy-12)+' L'+cx+' '+(cy-12)+'" fill="none" stroke="'+INK+'" stroke-width="1.6"/>';
  else{const p1=E(a1,20),p2=E(a2,20),md=(a1+a2)/2,t1=E(md,14),t2=E(md,26);s+='<path d="M'+f1(p1[0])+' '+f1(p1[1])+' A20 20 0 0 0 '+f1(p2[0])+' '+f1(p2[1])+'" fill="none" stroke="'+BLUE+'" stroke-width="2.5"/>'+ln(t1[0],t1[1],t2[0],t2[1],{c:BLUE})}
  return s+dot(cx,cy,INK,3)+tx(cx,cy+18,l,{w:700})}

/* ---------- segments ---------- */
function segfig(o){

  ref:["Translation: (x, y) \u2192 (x + a, y + b), vector \u27E8a, b\u27E9.","Reflections: x-axis (x, \u2212y). y-axis (\u2212x, y). y = x (y, x). y = \u2212x (\u2212y, \u2212x). Across x = k: x\u2032 = 2k \u2212 x. Across y = k: y\u2032 = 2k \u2212 y.","Rotations about the origin, counterclockwise: 90\u00B0 (\u2212y, x). 180\u00B0 (\u2212x, \u2212y). 270\u00B0 (y, \u2212x). 90\u00B0 clockwise = 270\u00B0 counterclockwise.","Dilation about the origin: (x, y) \u2192 (kx, ky). Lengths scale by k and areas by k\u00B2.","Rigid motions (translation, reflection, rotation) keep distance and angle measure. Dilations do not.","In a composition, do the transformations in order. Changing the order can change the answer."]}
];

/* ---------- state ---------- */
const KEY="geoMidyearHub_v1";
const def=()=>({name:"",period:"",level:2,points:0,days:[],zones:{1:{c:0,best:0},2:{c:0,best:0},3:{c:0,best:0},4:{c:0,best:0}},skills:{},recent:{1:[],2:[],3:[],4:[]},plan:{},bossBest:0,diag:null});
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j)return Object.assign(def(),j)}catch(e){}return def()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA");
const $=id=>document.getElementById(id);
function show(id){["welcome","home","quiz","result"].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}

/* ---------- run builder ---------- */
function pool(c,level){return GENS[c].filter(g=>level===1?g.d<=2:level===3?g.d>=2:true)}
function build(c,n,level){
  const items=pool(c,level);let seq=[],out=[],seen=new Set(),guard=0;
  while(out.length<n&&guard++<600){if(!seq.length)seq=shuffle(items);const g=seq.pop();const q=g.f();const key=q.q+"|"+q.opts.join("|");if(seen.has(key))continue;seen.add(key);q.ch=c;out.push(q)}
  return out;
}
let run=null;
function startRun(type,ch){
  let qs=[];
  if(type==="zone")qs=build(ch,8,S.level);
  else if(type==="diag")qs=[1,2,3,4].flatMap(c=>build(c,3,S.level));
  else qs=shuffle([1,2,3,4].flatMap(c=>build(c,5,S.level)));
  run={type,ch,qs,i:0,score:0,pts:0,res:[],hint:0,done:false};
  show("quiz");renderQ();
}
function renderQ(){
  const q=run.qs[run.i],ch=CH[q.ch];run.hint=0;run.done=false;$("leaveBox").hidden=true;
  $("qprog").textContent=`Question ${run.i+1} of ${run.qs.length}`;
  $("qbar").style.width=(run.i/run.qs.length*100)+"%";
  $("qcard").innerHTML=`<p class="tag" style="--cc:${ch.c}">${ch.n}: ${q.skill}</p>
   <p class="qtext">${q.q}</p>${q.fig}
   <div class="opts" role="group" aria-label="Answer choices">${q.opts.map((o,k)=>`<button class="opt" data-act="ans" data-k="${k}"><span class="ltr">${"ABCD"[k]}</span><span>${o}</span><span class="mark"></span></button>`).join("")}</div>
   <div class="hintbox" id="hintbox"></div>
   <div class="row"><button class="ghost" id="hintBtn" data-act="hint">Show a hint (halves your points)</button></div>
   <div id="fb" aria-live="polite"></div>`;
  if(!q.hints.length)$("hintBtn").hidden=true;
}
function showHint(){
  const q=run.qs[run.i];if(run.hint>=q.hints.length)return;
  $("hintbox").insertAdjacentHTML("beforeend",`<p><b>Hint ${run.hint+1}:</b> ${q.hints[run.hint]}</p>`);run.hint++;
  if(run.hint>=q.hints.length)$("hintBtn").hidden=true;
}
function answer(k){
  if(run.done)return;run.done=true;
  const q=run.qs[run.i],ok=k===q.ans,btns=[...document.querySelectorAll(".opt")];
  btns.forEach((b,i)=>{b.disabled=true;if(i===q.ans){b.classList.add("right");b.querySelector(".mark").textContent="\u2713 Correct"}else if(i===k){b.classList.add("wrong");b.querySelector(".mark").textContent="\u2717 Your answer"}});
  $("hintBtn").hidden=true;
  const base=run.type==="boss"?15:10,pts=ok?(run.hint?Math.ceil(base/2):base):0;
  run.pts+=pts;if(ok)run.score++;
  run.res.push({skill:q.skill,ch:q.ch,ok});
  const sk=S.skills[q.ch+"|"+q.skill]||(S.skills[q.ch+"|"+q.skill]={r:0,t:0});sk.t++;if(ok)sk.r++;
  S.recent[q.ch].push(ok?1:0);if(S.recent[q.ch].length>15)S.recent[q.ch].shift();
  S.points+=pts;save();
  const last=run.i===run.qs.length-1;
  $("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><strong>${ok?"\u2713 Correct":"\u2717 Not quite"}${ok?` (+${pts} points)`:`. The answer is ${"ABCD"[q.ans]}.`}</strong><p>${q.sol}</p></div><button class="primary" data-act="next">${last?"See results":"Next question"}</button>`;
  $("fb").querySelector("button").focus();
}
function next(){run.i++;if(run.i>=run.qs.length)finish();else renderQ()}

/* ---------- finish ---------- */
function finish(){
  const n=run.qs.length;let extra="",bonus=0;
  if(!S.days.includes(today())){S.days.push(today());bonus=20;S.points+=bonus;extra=`<div class="toast">Practice day ${S.days.length} logged. +20 points.</div>`}
  let msg="";
  if(run.type==="zone"){const z=S.zones[run.ch];z.best=Math.max(z.best,run.score);
    if(run.score>=6){z.c=1;msg=`<p><b>Zone cleared.</b> You scored at least 6 out of 8.</p>`}else msg=`<p>You need 6 out of 8 to clear this zone. Check the quick reference, then try again with fresh questions.</p>`}
  if(run.type==="boss"){S.bossBest=Math.max(S.bossBest,run.score);msg=`<p>Best Boss Battle score: <b>${S.bossBest}</b> out of 20.</p>`}
  if(run.type==="diag"){S.diag=[1,2,3,4].map(c=>run.res.filter(r=>r.ch===c&&r.ok).length);
    const need=[1,2,3,4].filter(c=>S.diag[c-1]<=1).map(c=>CH[c].n);
    msg=need.length?`<p><b>Start with:</b> ${need.join(", ")}. These had the most misses.</p>`:`<p>You did well on all four chapters. Go for the zones to lock in your speed, then take on the Boss Battle.</p>`}
  save();sync();
  const bySkill={};run.res.forEach(r=>{const k=r.ch+"|"+r.skill;(bySkill[k]=bySkill[k]||{ch:r.ch,s:r.skill,r:0,t:0});bySkill[k].t++;if(r.ok)bySkill[k].r++});
  const weak=Object.values(bySkill).filter(v=>v.r<v.t&&v.r/v.t<.7).sort((a,b)=>a.r/a.t-b.r/b.t);
  const rows=Object.values(bySkill).map(v=>`<li>${CH[v.ch].n}: ${v.s}: ${v.r} of ${v.t} ${v.r===v.t?"\u2713":""}</li>`).join("");
  $("result").innerHTML=`<div class="sheet"><h2>${run.type==="diag"?"Diagnostic results":run.type==="boss"?"Boss Battle results":CH[run.ch].n+" practice results"}</h2>
   <p class="big" style="margin-top:12px">${run.score}<span class="muted" style="font-size:1.6rem"> / ${n}</span></p>
   <p>You earned <b>${run.pts}</b> points this round.</p>${extra}${msg}
   ${weak.length?`<h3 style="margin-top:14px">Revisit these skills</h3><ul class="list">${weak.map(v=>`<li>${CH[v.ch].n}: <b>${v.s}</b> (${v.r} of ${v.t})</li>`).join("")}</ul>`:""}
   <details><summary>Skill-by-skill breakdown</summary><ul class="list">${rows}</ul></details>
   <div class="row" style="margin-top:16px">${run.type==="zone"?`<button class="primary" data-act="zone" data-c="${run.ch}">Try ${CH[run.ch].n} again</button>`:""}<button class="ghost" data-act="home">Back to the hub</button></div></div>`;
  show("result");
}

/* ---------- leaderboard (optional) ---------- */
function sync(){
  if(!CONFIG.SCRIPT_URL)return;
  try{fetch(CONFIG.SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"submit",name:S.name,period:S.period,points:S.points,days:S.days.length,boss:S.bossBest})}).catch(()=>{})}catch(e){}
}
async function loadBoard(){
  const el=$("board");if(!el||!CONFIG.SCRIPT_URL)return;
  try{const r=await fetch(CONFIG.SCRIPT_URL+"?action=leaderboard");const j=await r.json();
    el.innerHTML=`<table><tr><th>Rank</th><th>Name</th><th>Period</th><th>Days</th><th>Points</th></tr>${j.slice(0,10).map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${esc(p.period)}</td><td>${esc(p.days)}</td><td>${esc(p.points)}</td></tr>`).join("")}</table>`}
  catch(e){el.textContent="The leaderboard could not load right now. Your points are still saved on this device."}
}

/* ---------- home ---------- */
function ready(c){const a=S.recent[c];if(!a.length)return null;return Math.round(a.reduce((x,y)=>x+y,0)/a.length*100)}
function label(p){return p===null?"Not started":p>=80?"Strong":p>=60?"Getting there":"Needs practice"}
function renderHome(){
  const bossOpen=[1,2,3,4].every(c=>S.zones[c].c);
  const cleared=[1,2,3,4].filter(c=>S.zones[c].c).length;
  $("home").innerHTML=`
  <h1>Geometry Midyear Review</h1>
  <p class="muted" style="margin:10px 0 0">Chapters 1 to 4. Aim for about 15 to 20 minutes a day over break. Your progress saves on this device.</p>
  <div class="titleblock" aria-label="Student summary">
    <div><div class="k">Student</div><div class="v">${esc(S.name)}</div></div>
    <div><div class="k">Period</div><div class="v">${esc(S.period)}</div></div>
    <div><div class="k">Days practiced</div><div class="v">${S.days.length}</div></div>
    <div><div class="k">Points</div><div class="v">${S.points}</div></div>
  </div>

  <div class="sheet"><h2>Choose your level</h2>
    <p class="muted small" style="margin:6px 0 0">You can change this any time. Questions are new every round.</p>
    <div class="levels" role="group" aria-label="Level">
      ${[[1,"Level 1: Build up","Shorter steps and more core skills."],[2,"Level 2: On target","A mix of everything on the exam."],[3,"Level 3: Stretch","Multi-step problems and challenge questions."]].map(l=>`<button class="lv" data-act="level" data-l="${l[0]}" aria-pressed="${S.level===l[0]}"><b>${l[1]}</b><span class="small">${l[2]}</span></button>`).join("")}
    </div>
  </div>

  <div class="sheet"><h2>Step 1: Check where you stand</h2>
    <p style="margin:6px 0 12px">Twelve mixed questions, three from each chapter. Use it to decide which zone to start with.</p>
    <button class="primary" data-act="diag">${S.diag?"Take the diagnostic again":"Start the diagnostic"}</button>
    ${S.diag?`<p class="small muted" style="margin:10px 0 0">Last result: ${S.diag.map((v,i)=>`Ch ${i+1}: ${v}/3`).join(", ")}</p>`:""}
  </div>

  <h2 style="margin-top:26px">Step 2: Clear each zone</h2>
  <p class="muted" style="margin:6px 0 0">Score at least 6 out of 8 to clear a zone. ${cleared} of 4 cleared.</p>
  ${[1,2,3,4].map(c=>{const p=ready(c),z=S.zones[c];return `
  <div class="zone" style="--cc:${CH[c].c}">
    <h3><span>${CH[c].n}: ${CH[c].t}</span><span class="state">${z.c?"\u2713 Cleared":label(p)}${p!==null?` (${p}%)`:""}</span></h3>
    <p class="small muted" style="margin:6px 0 0">${CH[c].d}</p>
    <div class="ruler" role="img" aria-label="Readiness ${p===null?"not started":p+" percent"}"><div class="fill" style="width:${p||0}%"></div><div class="ticks"></div></div>
    <div class="row"><button class="primary" data-act="zone" data-c="${c}">Practice ${CH[c].n} (8 questions)</button>${z.best?`<span class="small muted">Best: ${z.best} of 8</span>`:""}</div>
    <details><summary>Quick reference</summary><ul>${CH[c].ref.map(r=>`<li>${r}</li>`).join("")}</ul></details>
  </div>`}).join("")}

  <h2 style="margin-top:26px">Step 3: Boss Battle</h2>
  <div class="zone boss">
    <h3><span>Midyear Boss Battle</span><span class="state">${bossOpen?"Unlocked":"Locked"}</span></h3>
    <p style="margin:6px 0 10px">Twenty mixed questions from all four chapters, in random order. Each correct answer is worth 15 points.</p>
    ${bossOpen?`<button class="primary" data-act="boss">Start the Boss Battle</button>`:`<button class="primary" disabled>Clear all four zones to unlock</button>`}
    ${S.bossBest?`<p class="small muted" style="margin:10px 0 0">Best score: ${S.bossBest} of 20</p>`:""}
  </div>

  ${CONFIG.SCRIPT_URL?`<div class="sheet lb"><h2>Break Challenge leaderboard</h2><p class="muted small" style="margin:6px 0 10px">Points come from correct answers plus 20 for each day you practice.</p><div id="board">Loading\u2026</div></div>`:""}
  <p class="small muted" style="margin-top:20px">Not you? <button class="ghost" data-act="switch" style="padding:2px 10px">Switch student</button></p>
  <div id="swBox" class="toast" hidden><p style="margin:0 0 8px">Switching students clears saved progress on this device.</p><div class="row"><button class="primary" data-act="switchYes">Yes, switch student</button><button class="ghost" data-act="switchNo">Cancel</button></div></div>`;
  show("home");loadBoard();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==="start"){const n=$("nm").value.trim(),p=$("pd").value;if(!n||!p){$("welcomeErr").textContent="Enter your name and choose your period to continue.";return}
    S.name=n;S.period=p;save();renderHome()}
  else if(a==="level"){S.level=+b.dataset.l;save();renderHome()}
  else if(a==="diag")startRun("diag");
  else if(a==="zone")startRun("zone",+b.dataset.c);
  else if(a==="boss")startRun("boss");
  else if(a==="ans")answer(+b.dataset.k);
  else if(a==="hint")showHint();
  else if(a==="next")next();
  else if(a==="leave"){$("leaveBox").hidden=false;$("leaveBox").scrollIntoView({block:"nearest"})}
  else if(a==="leaveNo")$("leaveBox").hidden=true;
  else if(a==="leaveYes"){$("leaveBox").hidden=true;renderHome()}
  else if(a==="home")renderHome();
  else if(a==="switch")$("swBox").hidden=false;
  else if(a==="switchNo")$("swBox").hidden=true;
  else if(a==="switchYes"){S=def();save();$("nm").value="";$("pd").value="";show("welcome")}
});

if(S.name&&S.period)renderHome();else show("welcome");
</script>
</body>
</html>
